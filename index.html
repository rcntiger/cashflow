<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캐시플로우</title>
<meta name="description" content="가계 자산 장부 — 부동산·주식·연금·공제회 기록과 현금흐름·은퇴 시뮬레이션">
<meta name="theme-color" content="#080C12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --accent:#4A90D9;--good:#2ECC7A;--bad:#E85555;--warn:#E8A020;
  --c0:#4A90D9;--c1:#2ECC7A;--c2:#E8A020;--c3:#C06AF0;--c4:#E85555;--c5:#3BC3C3;
  --mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;
  --f-xs:13px;--f-sm:15px;--f-md:17px;--f-lg:22px;--f-xl:30px;
}
[data-theme=dark]{
  --bg:#080C12;--s1:#0F1520;--s2:#161E2E;--s3:#1E2A3E;
  --bd:#253047;--t1:#C8D8EC;--t2:#6B84A0;--t3:#344560;
  --debt-bg:#221822;--debt-bd:#4A2C3A;
}
[data-theme=light]{
  --bg:#EEF3FB;--s1:#FFFFFF;--s2:#F5F8FF;--s3:#EAF0FA;
  --bd:#DDE6F5;--t1:#1A2540;--t2:#6B7A99;--t3:#B0BAD0;
  --debt-bg:#FDEEF1;--debt-bd:#F4CAD3;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
#view{min-height:calc(100vh - 60px);background:var(--bg)}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);font-size:var(--f-md);line-height:1.45}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:var(--f-lg);font-weight:700;flex:1}
.hbtn{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:var(--f-sm);cursor:pointer}
#cloud{font-size:var(--f-xs);color:var(--t2)}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--s1);border-top:1px solid var(--bd);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;white-space:nowrap;background:none;border:0;padding:9px 1px 8px;font-size:var(--f-xs);color:var(--t2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:var(--f-md);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.muted{color:var(--t2);font-size:var(--f-sm)}
.tiny{color:var(--t2);font-size:var(--f-xs)}
.big{font-size:var(--f-xl);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{background:var(--s2);border-radius:10px;padding:10px}
.kv .k{font-size:var(--f-xs);color:var(--t2)}
.kv .v{font-size:var(--f-md);font-family:var(--mono);margin-top:2px}
.row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--bd);cursor:pointer}
.row:first-of-type{border-top:0}
.row .m{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-family:var(--mono);text-align:right;white-space:nowrap}
.g-fam .tlist .row .v,.g-fam .tlist ~ .row .v{font-family:var(--sans);font-variant-numeric:tabular-nums}   /* 가족 타임라인: 금액을 항목 글자와 같은 글꼴·크기로 */
.grp{font-size:var(--f-sm);color:var(--t2);margin:14px 2px 2px;display:flex;justify-content:space-between}
.grp:first-child{margin-top:0}
.sec-h{display:flex;align-items:center;gap:10px;margin:20px 2px 10px}
.sec-h .ttl2{font-size:21px;font-weight:800;color:var(--accent);border-left:4px solid var(--accent);padding-left:10px;line-height:1.2}
.sec-h .sec-sum{font-size:var(--f-md);color:var(--t2)}
.lay .colL>.sec-h:first-child,.lay .colR>.sec-h:first-child{margin-top:0}
.cat-h{margin-top:0!important;align-items:center}
h2.ttl{font-size:19px;font-weight:800;color:var(--accent);padding-left:10px;border-left:4px solid var(--accent);line-height:1.2}
.salsum .kv .v{font-size:20px;margin-top:4px}
.msum{text-align:center}
.msum .kv .k{font-size:var(--f-sm)}
.msum .kv .v{font-size:24px;font-weight:800;margin-top:4px}
.prow{border-top:1px solid var(--bd);padding:10px 0}
.pl1{display:flex;align-items:baseline;gap:8px}
.pper{color:var(--t2);font-variant-numeric:tabular-nums;min-width:96px;font-size:var(--f-sm)}
.ptot{font-weight:800;font-size:18px;flex:1;font-variant-numeric:tabular-nums}
.psp{font-size:var(--f-xs);color:var(--t2)}
.pdf{font-size:var(--f-sm);font-weight:700;min-width:44px;text-align:right}
.pl2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pchip{font-size:var(--f-xs);padding:4px 9px;border-radius:8px;background:var(--s2);cursor:pointer}
.pchip b{font-weight:700;margin-left:5px}
.pchip.outc{background:var(--debt-bg);color:var(--t2)}
.prow.key{border-top:2px solid var(--warn)}
.pev{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pev span{font-size:var(--f-xs);font-weight:700;color:#1a1205;background:var(--warn);padding:2px 9px;border-radius:99px}
.pchg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:var(--f-xs);color:var(--t2)}
.pchg span::before{content:'· '}
.pbar{display:flex;gap:2px;height:28px;border-radius:7px;overflow:hidden;margin:2px 0 4px}
.pbar div{display:flex;align-items:center;justify-content:center;font-size:var(--f-xs);font-weight:700;color:#fff;cursor:pointer;min-width:4px}
.pbar .ok{background:var(--c1)} .pbar .bad{background:#e05252}
.pax{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:6px}
.psec{border-top:1px solid var(--bd);padding:12px 2px}
.psec.bad{background:rgba(224,82,82,.10);border:1px solid rgba(224,82,82,.55);border-radius:10px;padding:12px 10px;margin:8px 0}
.pevh{font-size:var(--f-sm);font-weight:700;color:var(--warn);margin-bottom:4px}
.psec.bad .pevh{color:#ff7b7b}
.pdur{font-size:var(--f-xs);color:var(--t2)}
.peq{display:flex;align-items:baseline;gap:6px;margin:6px 0 8px;font-size:var(--f-sm);color:var(--t2);flex-wrap:wrap}
.peq b{color:var(--t1);font-size:var(--f-md);font-variant-numeric:tabular-nums}
.pnet{margin-left:auto;text-align:right}
.pnet>div:first-child{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.psum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 12px}
.psum>div{background:var(--s2);border-radius:10px;padding:8px 10px;min-width:0}
.psum .l{font-size:var(--f-xs);color:var(--t2)}
.psum .v{font-size:var(--f-md);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pdelta{font-size:var(--f-xs);color:var(--t2);margin:-4px 0 6px}
.pcov{font-size:var(--f-xs);margin:-2px 0 8px;padding:6px 9px;border-radius:8px;background:var(--s2)}
.pcov b{white-space:nowrap}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.tlchips{position:sticky;top:var(--hdr,57px);z-index:6;background:var(--bg);margin:0 -12px!important;padding:8px 12px 12px}
.tlgraph{position:sticky;top:calc(var(--hdr,57px) + var(--tlc,0px));z-index:5;background:var(--s1);margin:-14px -14px 0;padding:14px 14px 8px;border-radius:14px 14px 0 0;border-bottom:1px solid var(--bd)}
.tlist{margin-top:6px}
.lfgraph{position:sticky;top:calc(var(--hdr,57px) + var(--tlc,0px));z-index:5;background:var(--s1);margin:0 -14px 6px;padding:6px 14px 8px;border-bottom:1px solid var(--bd)}
.lfm{margin:4px 0 2px}.lfm .row{padding:6px 2px}.lfm .t{font-size:var(--f-sm)}.lfm .v{font-size:var(--f-sm)}
.lfn{width:20px;height:20px;border-radius:50%;background:var(--warn);color:#1a1205;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.psec.tlhit{animation:tlhit 2.4s ease-out}
/* 생애흐름 세로 원장 */
.lfflt{margin:4px 0 10px!important}
.spw{position:relative}
.spi{display:flex;align-items:stretch}
.sprail{width:30px;flex:none;display:flex;flex-direction:column;align-items:center}
.sprail .rt{width:3px;height:18px;background:var(--rp)}
.sprail .dot{width:13px;height:13px;border-radius:50%;flex:none;background:var(--dc);border:2px solid var(--s1);box-shadow:0 0 0 2px var(--dc)}
.sprail .rb{width:3px;flex:1;min-height:14px;background:var(--rn)}
.spc{flex:1;min-width:0;background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:11px 12px;margin:4px 0}
.spc.bad{background:linear-gradient(180deg,rgba(232,85,85,.10),var(--s2) 70%);border-color:rgba(232,85,85,.5)}
.spc.wn{border-color:rgba(232,160,32,.5)}
.sptop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.spym{font-family:var(--mono);font-weight:700;background:var(--s3);padding:1px 8px;border-radius:7px}
.spage{font-size:var(--f-xs);color:var(--t2)}
.sphead{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.sptag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid}
.splump{font-family:var(--mono);font-size:var(--f-sm);font-weight:700;margin-left:auto}
.spev{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:var(--f-sm)}
.spev.clk{cursor:pointer}.spev .t{flex:1;min-width:0}.spev .v{font-family:var(--mono);white-space:nowrap}
.spdot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 6px}
.speq{background:var(--s1);border-radius:10px;padding:8px 10px;margin:8px 0}
.speq .l{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:var(--f-sm);color:var(--t2)}
.speq .l b{color:var(--t1);font-family:var(--mono)}
.speq .n{margin-left:auto;font-family:var(--mono);font-weight:800;font-size:var(--f-md)}
.speq .pl2{margin-top:6px}
.spstk{border-top:1px dashed var(--bd);padding-top:8px}
.spstk .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:var(--f-sm);color:var(--t2)}
.spstk .top b{color:var(--t1);font-family:var(--mono)}
.spstk .d{font-family:var(--mono);font-size:var(--f-xs);font-weight:700}
.spst{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.spst.ok{background:rgba(46,204,122,.14);color:var(--good)}.spst.sv{background:rgba(59,195,195,.14);color:var(--c5)}
.spst.wn{background:rgba(232,160,32,.16);color:var(--warn)}.spst.bad{background:rgba(232,85,85,.16);color:var(--bad)}
.bbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--s3);gap:1.5px;margin-bottom:6px}
.bbar i{display:block;height:100%}
.bleg{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:12px;color:var(--t2)}
.bleg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.bleg b{font-family:var(--mono);color:var(--t1);font-weight:500}
.spbr{display:flex;align-items:stretch}
.spbr .sprail i{width:3px;flex:1;background:var(--rc)}
.spbp{margin:4px 0 6px;padding:4px 11px;border-radius:99px;font-size:12px;background:var(--s2);border:1px solid var(--bd);color:var(--t2)}
.spbp.save{border-color:rgba(59,195,195,.4)}.spbp.good{border-color:rgba(46,204,122,.4)}.spbp.bad{border-color:rgba(232,85,85,.55);background:rgba(232,85,85,.10);color:var(--t1)}
.spbp b{font-family:var(--mono)}
.spi.tlhit .spc,.spev.tlhit{animation:tlhit 2.4s ease-out}
.tlist .row.tlhit{animation:tlhit 2.4s ease-out}
@keyframes tlhit{0%,40%{background:rgba(232,160,32,.28)}100%{background:transparent}}
.pchip.gapc{background:transparent;border:1px solid var(--warn);color:var(--warn);cursor:default}
.rrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--f-sm);color:var(--t2);margin:-2px 0 10px}
.rrow input{width:76px;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-size:var(--f-md);text-align:right}
.grp.big{font-size:19px;font-weight:700;color:var(--t1);margin:20px 2px 4px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.grp.big:first-of-type{margin-top:4px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:var(--f-sm)}
.btn.sub{background:var(--s3);color:var(--t1)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:var(--f-xs)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-block;font-size:var(--f-xs);padding:1px 7px;border-radius:99px;background:var(--s3);color:var(--t2);margin-left:6px;vertical-align:middle}
.pos{color:var(--good)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:var(--f-sm)}
th,td{padding:7px 4px;border-top:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--t2);font-weight:500;font-size:var(--f-xs)}
td{font-family:var(--mono);white-space:nowrap}
label.f{display:block;margin-bottom:10px;font-size:var(--f-sm);color:var(--t2)}
.inp,label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-size:var(--f-md)}
label.chk{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:var(--f-sm)}
label.chk input{width:20px;height:20px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--s1);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:var(--f-lg);margin-bottom:14px}
.chk-item{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-top:1px solid var(--bd)}
.chk-item:first-child{border-top:0}
.chk-item input{width:22px;height:22px;margin-top:2px;flex:none}
.chk-item .tx{flex:1}
.chk-item.done .tx{color:var(--t2);text-decoration:line-through}
.chk-item .x{background:none;border:0;color:var(--t2);font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--s3);border:1px solid var(--bd);
  padding:9px 14px;border-radius:10px;font-size:var(--f-sm);opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.on{opacity:1}
svg text{font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:var(--f-xs);color:var(--t2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--t2);font-size:var(--f-sm);padding:8px 2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--s1);color:var(--t2);border-radius:99px;padding:5px 12px;font-size:var(--f-sm);cursor:pointer}
.chip{white-space:nowrap;padding:5px 10px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tblwrap table{min-width:100%;white-space:nowrap}
.tblwrap th,.tblwrap td{padding:6px 3px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mgrid label{font-size:var(--f-xs);color:var(--t2)}
.mgrid input{width:100%;padding:8px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--t1);font-family:var(--mono);font-size:var(--f-sm);text-align:right}
.grid{display:block}
.incg{margin-top:6px} .incg+.incg{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}
.incg-h{display:flex;align-items:center;gap:8px;margin-bottom:2px} .incg-h b{font-size:var(--f-md)}
.gaprow{cursor:default;opacity:.85}
.hbars{margin:4px 0 12px;display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:86px minmax(0,1fr) 86px;align-items:center;gap:8px;cursor:pointer;font-size:var(--f-sm)}
.hb .hl{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .ht{height:16px;background:var(--s2);border-radius:4px;overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:0 4px 4px 0}
.hb .hv{text-align:right;white-space:nowrap} .hb .hv small{color:var(--t2);font-size:var(--f-xs)}
.simL,.simR{display:block}
@media (max-width:1023px){ .mhide{display:none!important} }
.slbox{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.slbox h3{font-size:var(--f-sm);font-weight:700;color:var(--t2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.slg{margin-bottom:12px}.slg:last-child{margin-bottom:2px}
.slt{display:flex;justify-content:space-between;font-size:var(--f-sm);margin-bottom:4px}
.slt b{font-family:var(--mono);color:var(--accent)}
.slg input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}
.pc,.pcI{display:none}
@media (hover:hover){ .row:hover{background:var(--s2);border-radius:8px} tr:hover td{background:var(--s2)} .chip:hover,.hbtn:hover{border-color:var(--accent)} }
@media (min-width:640px){
  main{max-width:760px;padding:16px 20px calc(90px + env(safe-area-inset-bottom))}
  .modal{align-items:center}
  .sheet{max-width:540px;border-radius:16px;max-height:86vh;padding:20px}
}
@media (min-width:1024px){
  body{padding-left:208px}
  header{padding:14px 28px}
  nav{top:0;bottom:0;left:0;right:auto;width:208px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:76px 12px 20px;gap:4px}
  nav::before{content:'캐시플로우';position:absolute;top:22px;left:26px;font-weight:700;font-size:var(--f-lg);color:var(--t1)}
  nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:10px;font-size:var(--f-sm)}
  nav button .ic{width:22px;text-align:center}
  nav button.on{background:var(--s2)}
  main{max-width:1320px;padding:22px 28px 48px}
  #toast{bottom:28px}

<script>
/* ════════ 기본 상수 ════════ */
var CATS = {realestate:'부동산', stock:'주식', pension:'연금계좌', mutual:'공제회·저축', cash:'현금·예금', other:'기타'};

var TABS = [
  {id:'dash', name:'대시보드', ic:'◎'},
  {id:'fam', name:'가족', ic:'⌂'},
  {id:'assets', name:'자산', ic:'▤'},
  {id:'alloc', name:'예산', ic:'◫'},
  {id:'money', name:'자금흐름', ic:'₩'},

var BUCKET_DESC = {reserve:'비상금·교육비 — 예금·MMF', gap:'소득이 생활비보다 적은 기간용 — 공제회 → 예금·단기채', growth:'나머지 전부 — 지수 ETF (비중은 리밸런서)'};

function defaultBucket(cat){ return cat === 'cash' ? 'reserve' : (FIN_CATS.indexOf(cat) >= 0 ? 'growth' : ''); }
var LS_DATA = 'cf_data', LS_SNAPS = 'cf_snaps', LS_META = 'cf_meta';

function defaultData(){

    assets:[], debts:[], incomes:[], lumps:[],

/* ════════ 상태 ════════ */
var S = loadLocal();

var META = loadMeta();             // { base: 서버 updated_at, dirty: bool }
var TAB = localStorage.getItem('cf_tab') || 'dash';
var SIMSUB = localStorage.getItem('cf_simsub') || 'a';   // 시뮬 탭(모바일): a 요약 / y 연도별

var OWNER = localStorage.getItem('cf_owner') || '';     // 명의 필터 ('' = 전체)

function loadLocal(){

}
function normalize(d){
  var def = defaultData();

    d.sim.infl = 2.5; d.sim.nomL = r2n(d.sim.rate); d.sim.nomR = r2n(d.sim.rateR); d.sim.nomG = r2n(d.sim.rateG);

}
function loadSnaps(){ try{ return JSON.parse(localStorage.getItem(LS_SNAPS)) || {}; }catch(e){ return {}; } }
function loadMeta(){ try{ return JSON.parse(localStorage.getItem(LS_META)) || {}; }catch(e){ return {}; } }
function saveMeta(){ localStorage.setItem(LS_META, JSON.stringify(META)); }

function commit(){              // 데이터가 바뀔 때마다 호출
  try{ localStorage.setItem(LS_DATA, JSON.stringify(S)); }
  catch(e){ alert('이 기기에 저장하지 못했습니다 (' + (e && e.name || '오류') + ').\n브라우저 저장 공간을 확인하거나 ⚙ 설정 → 내보내기로 백업해 두세요.'); }

  render();
  cloudSchedule();
}

/* ════════ 유틸 ════════ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function safeUrl(u){ u = String(u || '').trim(); return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function num(v){ var n = parseFloat(String(v).replace(/,/g,'')); return isFinite(n) ? n : 0; }
// 금액 단위: 만원
function fm(v){
  if(HIDE) return '••••';
  var s = v < 0 ? '-' : ''; v = Math.abs(Math.round(v));
  if(v >= 10000){ return s + (Math.round(v/100)/100).toLocaleString('ko-KR') + '억'; }
  return s + v.toLocaleString('ko-KR') + '만';
}
function ymIdx(s){ if(!s) return null; var p = String(s).split('-'); return (+p[0])*12 + (+p[1]) - 1; }
function idxYm(i){ var y = Math.floor(i/12), m = i%12 + 1; return y + '-' + (m<10?'0':'') + m; }
function ymDot(s){ return s ? s.replace('-', '.') : ''; }
function nowIdx(){ var d = new Date(); return d.getFullYear()*12 + d.getMonth(); }
function thisMonth(){ return idxYm(nowIdx()); }
function sum(a, f){ return a.reduce(function(s,x){ return s + (f ? f(x) : x); }, 0); }
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2400); }

/* ════════ 계산 ════════ */
function byOwner(list){ return OWNER ? list.filter(function(x){ return (x.owner || '') === OWNER; }) : list; }
function totals(all){
  var A = all ? S.assets : byOwner(S.assets), D = all ? S.debts : byOwner(S.debts);
  var assets = sum(A, function(a){ return num(a.value); });
  var debts = sum(D, function(d){ return num(d.value); });
  var byCat = {};
  A.forEach(function(a){ byCat[a.cat] = (byCat[a.cat]||0) + num(a.value); });
  var fin = sum(A.filter(function(a){ return FIN_CATS.indexOf(a.cat) >= 0; }), function(a){ return num(a.value); });
  return {assets:assets, debts:debts, net:assets-debts, byCat:byCat, fin:fin};
}
// 급여 항목: 수입지출 탭 급여 장부와 연동 (그달 실제 입력값 → 없으면 가장 최근 연도 월 환산)
function isSalary(x){ return x.kind === 'salary'; }
function ledgerMonthly(who, i, avgOnly){   // avgOnly: 그달 실수령 대신 월 환산(기간 대표값)
  var y = Math.floor(i/12), m = i%12, P = (S.salary[y] || {})[who];
  var pay = P && P.months ? Math.floor(num(P.months[m]) + 1e-9) : 0;
  if(pay > 0 && !avgOnly) return {v: pay + sum(allExtras(y, P).filter(function(e){ return num(e.month) === m+1; }), function(e){ return Math.floor(num(e.amount) + 1e-9); }), src:'actual'};
  // 월급은 실수령을 입력한 가장 최근 연도의 월 평균, 수당은 그해 기록(본봉 자동 포함)이 있으면 그해 것, 없으면 같은 연도 것
  var hasMonths = function(k){ var s = salStat(k, who); return s && s.n > 0; };
  var all = Object.keys(S.salary).map(Number);
  var ys = all.filter(function(k){ return k <= y && hasMonths(k); }).sort(function(a,b){ return b-a; });
  if(!ys.length) ys = all.filter(hasMonths).sort(function(a,b){ return a-b; });
  if(ys.length){
    var base = salStat(ys[0], who), P0 = S.salary[ys[0]][who], Py = (S.salary[y] || {})[who];
    var autoPart = Py && autoOn(Py) ? autoExtras(y, Py) : autoExtras(ys[0], P0);       // 명절·연가: 그해 본봉이 있으면 그해 것
    var mSrc = Py && (Py.extras || []).length ? Py : P0, anyAuto = autoPart.length > 0;   // 성과상여금 등: 그해 기록 없으면 최근 연도 것
    var manual = (mSrc.extras || []).filter(function(e){ return !(anyAuto && AUTO_NAME.test(e.name)); });
    var ex = sum(autoPart.concat(manual), function(e){ return Math.floor(num(e.amount) + 1e-9); });
    var gr = y > ys[0] ? Math.pow(1 + num(S.sim.salGrow)/100, y - ys[0]) : 1;   // 급여 실질 상승률
    return {v: Math.round((base.avg + ex/12) * gr), src:'avg', year: ys[0]};
  }
  return null;
}
function incomeItemAt(x, i, avgOnly){
  if(isSalary(x)){ var l = ledgerMonthly(x.owner, i, avgOnly); if(l) return l.v; }
  return num(x.monthly);
}
// 급여 항목에 끝 월이 없으면 가족 정보의 퇴직 월(없으면 정년)까지로 봄
function incEnd(x){
  var e = ymIdx(x.end); if(e != null || !isSalary(x)) return e;
  var f = S.family.find(function(m){ return (m.rel === '본인' || m.rel === '배우자') && memberOf(m) === x.owner && m.birth; });
  return f ? retireIdx(f) : null;
}
function incomeAt(i, avgOnly){
  var seen = {};
  return sum(S.incomes.filter(function(x){
    var s = ymIdx(x.start), e = incEnd(x);
    if(!((s == null || s <= i) && (e == null || i <= e))) return false;
    if(isSalary(x) && ledgerMonthly(x.owner, i, avgOnly)){ if(seen[x.owner]) return false; seen[x.owner] = 1; }   // 급여 장부는 사람당 한 번만
    return true;
  }), function(x){ return incomeItemAt(x, i, avgOnly); });
}
// 같은 사람의 급여 장부 연동 항목끼리 기간이 겹치는지
function salOverlap(x){
  if(!isSalary(x)) return false;
  var s1 = ymIdx(x.start), e1 = incEnd(x); s1 = s1 == null ? -1e9 : s1; e1 = e1 == null ? 1e9 : e1;
  return S.incomes.some(function(y){
    if(y === x || !isSalary(y) || y.owner !== x.owner) return false;
    var s2 = ymIdx(y.start), e2 = incEnd(y); s2 = s2 == null ? -1e9 : s2; e2 = e2 == null ? 1e9 : e2;
    return s1 <= e2 && s2 <= e1;
  });
}
function lumpAt(i){
  return sum(S.lumps.filter(function(x){ return lumpHits(x, i); }), function(x){ return num(x.amount); });
}
// 그 달에 해당하는 목돈인지 (매년 반복이면 같은 달, 반복 끝까지)
function lumpHits(x, i){
  var s = ymIdx(x.month); if(s == null) return false;
  if(!x.repeat) return !x.done && s === i;
  if(x.ack != null && i <= x.ack) return false;
  var e = ymIdx(x.until);
  return i >= s && (e == null || i <= e) && (i - s) % 12 === 0;
}
// 오늘 이후 처음 돌아오는 달 (반복 목돈은 다음 회차)
function lumpNext(x, from){
  var s = ymIdx(x.month); if(s == null) return null;
  if(!x.repeat) return s >= from ? s : null;
  var e = ymIdx(x.until), i = s;
  while(i < from) i += 12;
  return (e == null || i <= e) ? i : null;
}
// 금융자산 시뮬레이션 (실질, 만원). 생활비 시작 전: 월 저축액만 더함 / 시작 후: 소득 − 생활비
function simRates(){
  var inf = S.sim.infl === '' || S.sim.infl == null ? 2.5 : num(S.sim.infl);
  var real = function(n){ var v = n === '' || n == null ? inf : num(n); return ((1 + v/100) / (1 + inf/100) - 1) * 100; };
  return {reserve:real(S.sim.nomR), gap:real(S.sim.nomG), growth:real(S.sim.nomL)};
}
function inflRate(){ return S.sim.infl === '' || S.sim.infl == null ? 2.5 : num(S.sim.infl); }
function simulate(){
  // 금융자산을 예산 통(① 생활 예비 ② 공백 대비 ③ 장기투자)별로 굴림. 모자라면 ② → ① → ③ 순서로 꺼내 씀, 남으면 ③에 더함
  var sim = S.sim, R = simRates(), mr = {};
  Object.keys(R).forEach(function(k){ mr[k] = Math.pow(1 + R[k]/100, 1/12) - 1; });
  var start = nowIdx(), end = num(sim.endYear)*12 + 11, life = ymIdx(sim.lifeStart) || start;
  var B = {reserve:0, gap:0, growth:0};
  S.assets.forEach(function(a){ if(FIN_CATS.indexOf(a.cat) < 0) return; var k = a.bucket === 'reserve' || a.bucket === 'gap' ? a.bucket : 'growth'; B[k] += num(a.value); });
  var bal = B.reserve + B.gap + B.growth, start0 = bal, years = [], yNet = 0, minV = bal, minI = start, firstNeg = null, bals = {}, bk = {}, B0 = {reserve:B.reserve, gap:B.gap, growth:B.growth};
  for(var i = start; i <= end; i++){
    Object.keys(B).forEach(function(k){ if(B[k] > 0) B[k] *= (1 + mr[k]); });
    var inc = incomeAt(i);
    var net = i < life ? num(sim.saveBefore) : inc - spendAt(i);
    net += lumpAt(i);
    if(net >= 0) B.growth += net;
    else { var need = -net; ['gap','reserve','growth'].forEach(function(k){ if(need <= 0) return; var take = k === 'growth' ? need : Math.min(Math.max(B[k], 0), need); B[k] -= take; need -= take; }); }
    bal = B.reserve + B.gap + B.growth; yNet += net; bals[i] = bal; bk[i] = {reserve:B.reserve, gap:B.gap, growth:B.growth};
    if(bal < minV){ minV = bal; minI = i; }
    if(bal < 0 && firstNeg == null) firstNeg = i;
    if(i % 12 === 11 || i === end){ years.push({y:Math.floor(i/12), bal:bal, net:yNet, b:{reserve:B.reserve, gap:B.gap, growth:B.growth}}); yNet = 0; }
  }
  return {years:years, minV:minV, minI:minI, firstNeg:firstNeg, start:start0, bals:bals, bk:bk, b0:B0, from:start};
}
// 월 소득이 같은 구간끼리 묶기
// 그 달의 월 생활비: 기본값(생활비 시작부터) → 기간별 생활비 중 시작월이 지난 마지막 구간
function spendAt(i){
  var life = ymIdx(S.sim.lifeStart);
  if(life != null && i < life) return null;
  if(S.sim.spendMode === 'expenses') return expenseAt(i) + debtCostAt(i);
  var v = num(S.sim.spend);
  sortedPhases().forEach(function(p){ var f = ymIdx(p.from); if(f != null && f <= i) v = num(p.monthly); });
  return v + debtCostAt(i);
}
// 고정지출 합계 (저축 분류 제외)

// 지출 분류: 기본 + 내가 만든 분류, 이름 바꾸기·숨기기 (S.catCfg = {키:{name, hidden}}, S.catCustom = [{k, name}])
function applyCats(){
  var cfg = (typeof S !== 'undefined' && S && S.catCfg) || {}, cus = (typeof S !== 'undefined' && S && S.catCustom) || [];
  EXP_CATS = {};
  Object.keys(EXP_DEFAULT).forEach(function(k){ if(k !== 'saving' && k !== 'etc') EXP_CATS[k] = (cfg[k] && cfg[k].name) || EXP_DEFAULT[k]; });
  cus.forEach(function(c){ EXP_CATS[c.k] = (cfg[c.k] && cfg[c.k].name) || c.name; if(!EXP_COLOR[c.k]) EXP_COLOR[c.k] = ['#5fb3c7','#c78f5f','#9f7ae0','#7ac77a','#e07aa8'][Object.keys(EXP_COLOR).length % 5]; });
  EXP_CATS.etc = (cfg.etc && cfg.etc.name) || EXP_DEFAULT.etc;
  EXP_CATS.saving = (cfg.saving && cfg.saving.name) || EXP_DEFAULT.saving;
}

function expEnd(x){ var l = linkEnd(x); return l != null ? l : ymIdx(x.end); }
function expActive(x, i){ var s = ymIdx(x.start), e = expEnd(x); return (s == null || s <= i) && (e == null || i <= e); }
function expenseAt(i){ return sum(S.expenses.filter(function(x){ return x.cat !== 'saving' && expActive(x, i); }), function(x){ return num(x.monthly); }); }
// 부채 월 비용: 월 상환액이 있으면 그 금액, 없으면 이자 (끝 월까지)
function debtCostAt(i){
  return sum(S.debts.filter(function(d){ var e = ymIdx(d.end), s = ymIdx(d.start); return (num(d.pay) > 0 || num(d.rate) > 0) && (s == null || s <= i) && (e == null || i <= e); }),
    function(d){ return num(d.pay) > 0 ? num(d.pay) : num(d.value) * num(d.rate) / 100 / 12; });
}
function sortedPhases(){ return (S.sim.phases || []).slice().sort(function(a,b){ return (a.from||'').localeCompare(b.from||''); }); }
// 월 소득·생활비가 같은 구간끼리 묶기
function incomePeriods(){
  var start = nowIdx(), end = num(S.sim.endYear)*12 + 11, out = [], cur = null;
  for(var i = start; i <= end; i++){
    var v = incomeAt(i, true), s = spendAt(i), pre = false;   // 기간 표는 월 환산 기준
    // 은퇴 전(생활비 시작 전)에는 표에 참고용으로 고정지출 합계를 보여 줌 (시뮬레이션 계산에는 쓰지 않음)
    if(s == null && S.expenses.length){ s = Math.round(expenseAt(i) + debtCostAt(i)); pre = true; }
    if(cur && cur.v === v && cur.s === s && cur.pre === pre){ cur.to = i; }
    else { cur = {from:i, to:i, v:v, s:s, pre:pre}; out.push(cur); }
  }
  return out;
}

/* ════════ 차트 (SVG) ════════ */
function donut(parts, big){
  var tot = sum(parts, function(p){ return p.v; });
  if(tot <= 0) return '<div class="empty">자산을 입력하면 비중이 보입니다</div>';
  var R = 54, C = 2*Math.PI*R, off = 0, segs = '';
  parts.forEach(function(p){
    var len = C * p.v / tot;
    segs += '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="22" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off += len;
  });
  var leg = parts.map(function(p){ return '<span><i style="background:'+p.c+'"></i>'+esc(p.n)+' '+Math.round(p.v/tot*100)+'%'+(big?'<b class="num pcI"> · '+fm(p.v)+'</b>':'')+'</span>'; }).join('');
  return '<div class="'+(big?'dnut-big':'')+'" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140">'+segs+'</svg><div class="legend" style="flex:1;flex-direction:column;gap:6px">'+leg+'</div></div>';
}
function lineChart(pts, opt){
  opt = opt || {};
  if(pts.length < 2) return '<div class="empty">'+(opt.empty || '기록이 두 개 이상이면 그래프가 보입니다')+'</div>';
  var W = 600, H = 220, L = 52, Rr = 12, T = 12, B = 28;
  var ys = pts.map(function(p){ return p.y; }); var mn = Math.min.apply(null, ys), mx = Math.max.apply(null, ys);
  if(opt.zero !== false || mn < 0) mn = Math.min(0, mn); else { var pad = (mx-mn)*0.15 || mx*0.05; mn = Math.max(0, mn-pad); mx = mx+pad; }
  if(mx === mn) mx = mn + 1;
  var X = function(i){ return L + (W-L-Rr) * i/(pts.length-1); };
  var Y = function(v){ return T + (H-T-B) * (1 - (v-mn)/(mx-mn)); };
  var g = '', k;
  for(k = 0; k <= 4; k++){ var v = mn + (mx-mn)*k/4; g += '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" font-size="12" fill="var(--t2)" text-anchor="end">'+fm(v)+'</text>'; }
  if(mn < 0) g += '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--bad)" stroke-width="1"/>';
  var step = Math.max(1, Math.ceil(pts.length/7));
  pts.forEach(function(p,i){ if(i % step === 0 || i === pts.length-1) g += '<text x="'+X(i)+'" y="'+(H-8)+'" font-size="12" fill="var(--t2)" text-anchor="'+(i===pts.length-1?'end':i===0?'start':'middle')+'">'+esc(p.x)+'</text>'; });
  var d = pts.map(function(p,i){ return (i?'L':'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); }).join(' ');
  var marks = (opt.marks || []).map(function(m){ var i = pts.findIndex(function(p){ return p.x === m.x; }); if(i < 0) return '';
    return '<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="'+m.c+'" stroke-dasharray="4 4"/><text x="'+(X(i)+4)+'" y="'+(T+12)+'" font-size="11" fill="'+m.c+'">'+esc(m.t)+'</text>'; }).join('');
  var last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+marks+'<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+
    '<circle cx="'+X(pts.length-1)+'" cy="'+Y(last.y)+'" r="4" fill="var(--accent)"/></svg>';
}
function barChart(bars, line){
  if(!bars.length) return '';
  var W = 600, H = 220, L = 48, Rr = 8, T = 12, B = 28;
  var mx = Math.max.apply(null, bars.map(function(b){ return Math.max(b.v, b.line || 0); })) || 1;
  var bw = (W-L-Rr) / bars.length;
  var Y = function(v){ return T + (H-T-B) * (1 - v/mx); };
  var g = '', k;
  for(k = 0; k <= 4; k++){ var v = mx*k/4; g += '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--bd)"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" font-size="12" fill="var(--t2)" text-anchor="end">'+(HIDE?'':Math.round(v).toLocaleString())+'</text>'; }
  var step = Math.max(1, Math.ceil(bars.length/8));
  bars.forEach(function(b,i){
    var x = L + bw*i + bw*0.15, w = bw*0.7, y = Y(b.v);
    g += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(0,(H-B)-y)+'" rx="2" fill="'+b.c+'"><title>'+esc(b.x)+': 월 '+fm(b.v)+'</title></rect>';
    if(i % step === 0) g += '<text x="'+(x+w/2)+'" y="'+(H-8)+'" font-size="12" fill="var(--t2)" text-anchor="middle">'+esc(b.x)+'</text>';
  });
  var lp = bars.map(function(b,i){ return b.line == null ? null : [L + bw*i + bw/2, Y(b.line)]; });
  var d = '', on = false;
  lp.forEach(function(p){ if(!p){ on = false; return; } d += (on?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ' '; on = true; });
  if(d) g += '<path d="'+d+'" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="6 4"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg>';
}

function pcLayout(v){

/* ── 지난 목돈 알림: 날짜가 된 목돈을 자산에 반영·미루기·완료 처리 ── */
function dueLumps(){
  var now = nowIdx(), out = [];
  S.lumps.forEach(function(l){
    var s = ymIdx(l.month); if(s == null) return;
    if(!l.repeat){ if(!l.done && s <= now) out.push({l:l, i:s}); return; }
    var e = ymIdx(l.until), i = s, last = null;                       // 반복: 확인 안 한 가장 최근 회차
    while(i <= now && (e == null || i <= e)){ if(l.ack == null || i > l.ack) last = i; i += 12; }
    if(last != null) out.push({l:l, i:last});
  });
  return out.sort(function(a,b){ return a.i - b.i; });
}

function dueApplySave(id, i){
  var l = S.lumps.find(function(x){ return x.id === id; }), sign = num(l.amount) >= 0 ? 1 : -1, amt = Math.abs(num(fv('f_amt'))) * sign, to = fv('f_to'), asset;

function dueDone(id, i){

var _modalPushed = false, _ignorePop = false;
function modalOpen(){ return document.getElementById('modal').classList.contains('on'); }
function openModal(html){
  document.getElementById('sheet').innerHTML = html;
  if(!modalOpen() && !_modalPushed){ history.pushState({tab:TAB, modal:1}, '', location.hash); _modalPushed = true; }
  document.getElementById('modal').classList.add('on');
}
function closeModal(fromPop){
  if(!modalOpen()) return;
  document.getElementById('modal').classList.remove('on');

}
// PC 단축키: 1~7 탭 이동, Esc 창 닫기 / 창 크기 바뀌면 다시 그림
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && modalOpen()){ closeModal(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if(modalOpen() || tag === 'input' || tag === 'select' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
  var n = parseInt(e.key, 10); if(n >= 1 && n <= TABS.length) go(TABS[n-1].id);
});
var _rsz = null, _lastW = window.innerWidth;
window.addEventListener('resize', function(){ clearTimeout(_rsz); _rsz = setTimeout(function(){ if(Math.abs(window.innerWidth - _lastW) > 40){ _lastW = window.innerWidth; render(); } }, 200); });
window.addEventListener('popstate', function(e){
  if(_ignorePop){ _ignorePop = false; return; }
  if(modalOpen()){ _modalPushed = false; closeModal(true); return; }
  var t = (e.state && e.state.tab) || 'dash';
  if(t !== TAB) go(t, true);
});

function saveMembers(){
  var next = S.members.map(function(m,i){ return {name:m.name, nick:fv('m_n'+i).trim(), email:fv('m_e'+i).trim().toLowerCase()}; });
  var shown = next.map(function(m){ return m.nick || m.name; });
  if(shown.some(function(n,i){ return shown.indexOf(n) !== i; }) || shown.indexOf('공동') >= 0){ alert('닉네임이 서로 같거나 \'공동\'입니다. 다르게 정해 주세요'); return; }
  S.members = next;
  closeModal(); commit(); toast('구성원을 저장했습니다');
}
function setTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem('cf_theme', t);
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#EEF3FB' : '#080C12'; openSettings(); }
function exportData(){
  var blob = new Blob([JSON.stringify({data:S, snapshots:SNAPS}, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cashflow-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}
function importFile(inp){
  var f = inp.files[0]; if(!f) return;
  f.text().then(function(txt){
    var j = JSON.parse(txt), d = j.data || j;
    if(j.mode === 'merge'){
      var keys = Object.keys(d), add = j.append || {};
      var desc = keys.map(function(k){ return {salary:'급여 장부', expenses:'고정지출', family:'가족'}[k] || k; }).concat(Object.keys(add).map(function(k){ return {lumps:'목돈 일정', debts:'부채', incomes:'소득 항목'}[k] + ' ' + add[k].length + '건 추가'; }));
      if(!confirm('다음 항목만 이 파일 내용으로 바꾸거나 더합니다. 나머지 장부는 그대로입니다.\n\n- ' + desc.join('\n- '))) return;
      keys.forEach(function(k){ S[k] = d[k]; });
      Object.keys(add).forEach(function(k){ (add[k] || []).forEach(function(x){ var o = Object.assign({}, x, {id:uid()}); if(!S[k].some(function(y){ return y.name === o.name && (y.month || '') === (o.month || ''); })) S[k].push(o); }); });
      S = normalize(S); closeModal(); commit(); toast('합쳤습니다'); return;
    }
    if(!d || !Array.isArray(d.assets)) throw new Error('형식이 맞지 않습니다');
    if(!confirm('지금 장부를 이 파일 내용으로 바꿀까요?')) return;
    S = normalize(d);
    if(j.snapshots){ SNAPS = Object.assign({}, SNAPS, j.snapshots); localStorage.setItem(LS_SNAPS, JSON.stringify(SNAPS)); if(_user) Object.keys(j.snapshots).forEach(function(k){ pushSnap(k); }); }
    closeModal(); commit(); toast('가져왔습니다');
  }).catch(function(e){ alert('가져오기 실패: ' + e.message); });
  inp.value = '';
}

function saveSnapshot(){
  var t = totals(true), m = thisMonth();
  if(SNAPS[m] && !confirm(ymDot(m)+' 기록을 지금 값으로 바꿀까요?')) return;
  SNAPS[m] = {net_worth:t.net, total_assets:t.assets, total_debts:t.debts, breakdown:t.byCat};
  localStorage.setItem(LS_SNAPS, JSON.stringify(SNAPS));
  pushSnap(m); render(); toast(ymDot(m)+' 순자산 '+fm(t.net)+' 기록');
}
async function pushSnap(m){
  if(!sb || !_user) return;
  var s = SNAPS[m];
  var r = await sb.from('cashflow_snapshots').upsert({household:'home', month:m, net_worth:s.net_worth, total_assets:s.total_assets, total_debts:s.total_debts, breakdown:s.breakdown, created_by:_user.email});
  if(r.error) setCloud('error', r.error.message);
}
async function pullSnaps(){
  var r = await sb.from('cashflow_snapshots').select('month,net_worth,total_assets,total_debts,breakdown').eq('household','home');
  if(r.error) return;
  var server = {};
  r.data.forEach(function(s){ server[s.month] = {net_worth:+s.net_worth, total_assets:+s.total_assets, total_debts:+s.total_debts, breakdown:s.breakdown}; });
  Object.keys(SNAPS).forEach(function(k){ if(!server[k]) pushSnap(k); });   // 이 기기에만 있던 기록은 올림
  SNAPS = Object.assign({}, SNAPS, server);
  localStorage.setItem(LS_SNAPS, JSON.stringify(SNAPS));
}

function salEmpty(P){
  if(!P) return true;
  var hasM = (P.months || []).some(function(v){ return v != null && v !== '' && num(v) !== 0; });
  var a = P.auto || {};
  return !hasM && !(P.extras || []).length && !(num(a.base1) || num(a.base2));
}
function fixMemberKeys(d){
  var MEMBER_KEYS = ['본인', '아내'];   // 데이터 읽기 중에 불리므로 함수 안에 둠
  if(!Array.isArray(d.members)) return;
  var moved = false, snap = null;
  d.members.forEach(function(m, i){
    var key = MEMBER_KEYS[i]; if(!key || m.name === key) return;
    if(!snap) snap = JSON.stringify(d);
    var old = m.name; moved = true;
    if(!m.nick) m.nick = old;
    Object.keys(d.salary || {}).forEach(function(y){
      var Y = d.salary[y]; if(!Y || !Y[old]) return;
      var A = Y[key], B = Y[old];
      if(salEmpty(A)) Y[key] = B;
      else if(!salEmpty(B)){                       // 둘 다 내용이 있으면 빈 달만 채워 합침
        A.months = A.months || []; (B.months || []).forEach(function(v, k){ if((A.months[k] == null || A.months[k] === '') && v != null && v !== '') A.months[k] = v; });
        (B.extras || []).forEach(function(e){ if(!(A.extras || []).some(function(x){ return x.name === e.name && x.month === e.month; })) (A.extras = A.extras || []).push(e); });
        if(!(num((A.auto || {}).base1)) && B.auto) A.auto = B.auto;
      }
      delete Y[old];
    });
    Object.keys(d).forEach(function(k){ if(Array.isArray(d[k])) d[k].forEach(function(x){ if(x && x.owner === old) x.owner = key; }); });
    if(typeof OWNER !== 'undefined' && OWNER === old){ OWNER = key; try{ localStorage.setItem('cf_owner', key); }catch(e){} }
    m.name = key;
  });
  if(moved && snap){ try{ localStorage.setItem('cf_backup_' + new Date().toISOString().slice(0,16), snap); pruneBackups(); }catch(e){} }
}
function nm(key){ var m = (S.members || []).find(function(x){ return x.name === key; }); return m && m.nick ? m.nick : key; }
function famName(f){
  var k = f.rel === '본인' ? '본인' : f.rel === '배우자' ? '아내' : null;
  var m = k && (S.members || []).find(function(x){ return x.name === k; });
  return m && m.nick ? m.nick : f.name;
}
function pruneBackups(){
  try{
    var ks = Object.keys(localStorage).filter(function(k){ return k.indexOf('cf_backup_') === 0; }).sort();
    ks.slice(0, Math.max(0, ks.length - 3)).forEach(function(k){ localStorage.removeItem(k); });
  }catch(e){}
}

function cloudSchedule(){
  if(!sb || !_user) return;
  clearTimeout(_pushTimer); _pushTimer = setTimeout(cloudPush, 1500);
}
// 같은 시각인지 비교 (서버는 +00:00, 앱은 Z 로 적어 글자로는 다를 수 있음)
function sameTime(a, b){ return !!a && !!b && Date.parse(a) === Date.parse(b); }
async function cloudPush(){
  if(!sb || !_user) return;
  if(_busy){ cloudSchedule(); return; }   // 동기화 중이면 버리지 않고 잠시 뒤 다시
  _busy = true; setCloud('saving');
  try{
    // 다른 사람이 먼저 바꿨는지 확인 (마지막으로 받은 시각과 비교)
    var cur = await sb.from('cashflow_data').select('updated_at').eq('household','home').maybeSingle();
    if(cur.error) throw cur.error;
    if(cur.data && META.base && !sameTime(cur.data.updated_at, META.base)){
      _busy = false; await resolveConflict(); return;
    }
    var now = new Date().toISOString();
    var r = await sb.from('cashflow_data').upsert({household:'home', data:S, updated_at:now, updated_by:_user.email}).select('updated_at').single();
    if(r.error) throw r.error;
    META.base = (r.data && r.data.updated_at) || now; META.dirty = false; META.by = _user.email; META.at = META.base; saveMeta();   // 서버가 돌려준 시각을 기억
    setCloud('saved');
  }catch(e){
    setCloud('error', /relation|does not exist|schema cache/i.test(e.message) ? 'cashflow 테이블이 없습니다 — supabase/cashflow.sql 을 먼저 실행하세요' : e.message);
  }
  _busy = false;
}
async function resolveConflict(){
  var r = await sb.from('cashflow_data').select('data,updated_at,updated_by').eq('household','home').maybeSingle();
  if(r.error || !r.data) return;
  var by = r.data.updated_by || '', who = by ? whoName(by) : '다른 기기';
  if(_user && by.toLowerCase() === _user.email.toLowerCase()) who = whoName(by) + '(이 계정의 다른 기기)';
  if(/^auto/.test(by)) who = '자동 갱신(매월 1일)';
  if(confirm(who + '이(가) 다른 기기에서 서버 장부를 먼저 바꿨습니다.\n\n확인: 서버 장부로 바꾸기 (이 기기의 최근 수정은 버림)\n취소: 이 기기 장부로 서버를 덮어쓰기')){
    applyServer(r.data);
  } else {
    META.base = r.data.updated_at; saveMeta(); cloudPush();
  }
}
function applyServer(row){
  S = normalize(row.data || {});
  localStorage.setItem(LS_DATA, JSON.stringify(S));
  META.base = row.updated_at; META.dirty = false; META.by = row.updated_by || ''; META.at = row.updated_at; saveMeta();
  render(); setCloud('saved');
}
async function cloudPull(manual){
  if(!sb || !_user || _busy) return;
  _busy = true; setCloud('saving');
  try{
    var r = await sb.from('cashflow_data').select('data,updated_at,updated_by').eq('household','home').maybeSingle();
    if(r.error) throw r.error;
    await pullSnaps();
    _busy = false;
    if(!r.data){                               // 서버가 비어 있음 → 이 기기 장부로 시작
      if(S.assets.length || S.incomes.length) await cloudPush(); else setCloud('saved');
    } else if(sameTime(r.data.updated_at, META.base)){ // 서버 변화 없음
      META.by = r.data.updated_by || META.by; META.at = r.data.updated_at; saveMeta();
      if(META.dirty) await cloudPush(); else { setCloud('saved'); render(); }
    } else if(META.dirty){
      await resolveConflict();
    } else {
      applyServer(r.data);
    }
    if(manual) toast('동기화했습니다');
  }catch(e){
    _busy = false;
    setCloud('error', /relation|does not exist|schema cache/i.test(e.message) ? 'cashflow 테이블이 없습니다 — supabase/cashflow.sql 을 먼저 실행하세요' : e.message);
    if(manual) alert('동기화 실패: ' + e.message);
  }
}

async function fetchRebalancer(){
  if(!sb || !_user){ alert('⚙ 설정에서 리밸런서와 같은 이메일로 로그인하세요'); return null; }

  if(r.error){ alert('리밸런서 데이터를 읽지 못했습니다: ' + r.error.message); return null; }
  var h = (r.data && r.data.history) || {}, keys = Object.keys(h).sort();
  if(!keys.length){ alert('리밸런서에 자산 기록이 없습니다. 리밸런서에서 시세 조회 후 동기화하세요.'); return null; }
  var last = keys[keys.length-1];
  _rbLast = {date:last, accounts:h[last].accounts || {}};

// 자산 이름에 명의가 이미 들어 있으면 한 번만 표시
function assetLabel(a){ var o = a.owner ? (a.owner === '공동' ? '공동' : nm(a.owner)) : ''; return a.name + (o && a.name.indexOf(o) < 0 ? ' (' + o + ')' : ''); }
// 리밸런서 계좌 이름으로 새 자산 만들기 (이름에 연금·IRP·퇴직이 있으면 연금계좌)
function newAssetFromAccount(n){
  var cat = /연금|IRP|퇴직|DC|ISA/i.test(n) ? 'pension' : 'stock';
  if(/ISA/i.test(n)) cat = 'stock';
  var a = {id:uid(), name:n, cat:cat, owner:'', value:0, note:'', bucket:defaultBucket(cat)};
  S.assets.push(a); return a.id;
}
function saveRbMap(){
  Object.keys(_rbLast.accounts).forEach(function(n,i){ var v = fv('rbm'+i); S.rbMap[n] = v === 'new' ? newAssetFromAccount(n) : v; });
  closeModal(); applyRebalancer();

/* ════════ 생애 타임라인 ════════ */
// 자녀 학업·군 일정 (생일로 중·고·대 입학 자동, 재수·휴학·군 복무는 수정 가능)
function childPlan(f){
  if(!f.birth) return null;
  var by = +f.birth.slice(0,4);
  var mid = ymIdx((by+13)+'-03'), high = ymIdx((by+16)+'-03');
  var uni = ymIdx(f.uniStart) != null ? ymIdx(f.uniStart) : ymIdx((by+19)+'-03');
  var years = num(f.uniYears) || 4, leave = num(f.leave) || 0;
  var army = null;
  if(f.noUni){   // 대학 안 감: 고교 졸업까지, 군은 기본 만 20세 되는 해 3월
    var hEnd = ymIdx((by+19)+'-02');
    if(f.army !== 'none'){ var as0 = ymIdx(f.armyStart) != null ? ymIdx(f.armyStart) : ymIdx((by+20)+'-03'), am0 = num(f.armyMonths) || 18; army = {from:as0, to:as0 + am0 - 1}; }
    var st0 = [{k:'중', a:mid, b:high-1}, {k:'고', a:high, b:hEnd}];
    if(army) st0.push({k:'군', a:army.from, b:army.to});
    return {mid:mid, high:high, uni:null, highEnd:hEnd, grad:hEnd, army:army, stages:st0, noUni:true};
  }
  if(f.army !== 'none'){
    var as = ymIdx(f.armyStart) != null ? ymIdx(f.armyStart) : uni + 12, am = num(f.armyMonths) || 18;
    army = {from:as, to:as + am - 1};
  }
  var stages = [{k:'중', a:mid, b:high-1}, {k:'고', a:high, b:uni-1}];
  var grad;
  if(army && army.from > uni && army.from < uni + years*12){
    var done = army.from - uni, resume = army.to + 1;
    while(resume % 12 !== 2 && resume % 12 !== 8) resume++;          // 3월·9월 복학
    grad = resume + years*12 - done + leave - 1;
    stages.push({k:'대', a:uni, b:army.from-1}, {k:'군', a:army.from, b:army.to}, {k:'대', a:resume, b:grad});
  } else {
    grad = uni + years*12 + leave - 1;
    if(army && army.from <= uni) stages.push({k:'군', a:army.from, b:army.to});
    stages.push({k:'대', a:uni, b:grad});
    if(army && army.from > grad) stages.push({k:'군', a:army.from, b:army.to});
  }
  return {mid:mid, high:high, uni:uni, highEnd:uni-1, grad:grad, army:army, stages:stages};
}
// 고정지출 끝 월 연결: "가족id:high" 또는 "가족id:grad"
function linkEnd(x){
  if(!x.link) return null; var p = x.link.split(':'), f = S.family.find(function(m){ return m.id === p[0]; });

function agesAt(i){
  if(i == null || !S.family.length) return '';
  return ' · ' + S.family.filter(function(f){ return f.rel !== '부모'; }).map(function(f){ return esc(famName(f))+' '+ageAt(f.birth, i); }).join(' ');
}
function familyMilestones(){
  var out = [], now = nowIdx(), end = num(S.sim.endYear)*12 + 11;
  S.family.forEach(function(f){
    if(!f.birth) return; var p = f.birth.split('-').map(Number);
    var at = function(age){ return (p[0]+age)*12 + p[1] - 1; };
    var add = function(age, text){ var i = at(age); if(i >= now && i <= end) out.push({i:i, text:esc(famName(f))+' 만 '+age+'세 — '+text}); };
    if(f.rel === '자녀'){ add(19, '성년. 증여재산공제 10년 5,000만 (미성년 때 받은 금액과 합산)'); }
    if(f.rel === '본인' || f.rel === '배우자'){ add(55, '연금저축·IRP 연금 수령 가능'); add(65, '비과세종합저축 가입 가능 (5,000만 한도)'); add(70, '연금소득세율 5.5% → 4.4%'); }
  });
  return out.sort(function(a,b){ return a.i - b.i; });
}
function milestoneCard(){
  var h = '<div class="card"><h2>이정표<span class="sp"></span><span class="tiny">나이에 따라 생기는 일</span></h2>';
  var ms = familyMilestones();
  if(ms.length) h += ms.map(function(m){ return '<div class="row" style="cursor:default"><div class="m"><div class="tiny num">'+ymDot(idxYm(m.i))+'</div><div>'+m.text+'</div></div></div>'; }).join('');
  if(!familyMilestones().length) h += '<div class="empty">가족 생년월일을 넣으면 연금 수령 가능, 성년 같은 시점이 보입니다</div>';
  return h + '</div>';
}
function viewFamily(){
  var h = '<div class="card R"><h2>가족 나이<span class="sp"></span><button class="btn sm" onclick="editFamily()">+ 추가</button></h2>';
  if(!S.family.length) return h + '<div class="empty">생일을 넣으면 목돈 일정과 지출 표에 그때 나이가 함께 보입니다</div></div>';
  var now = nowIdx(), cy = Math.floor(now/12), ys = [cy];
  S.lumps.forEach(function(l){ var i = ymIdx(l.month); if(i != null && !l.repeat) ys.push(Math.floor(i/12)); });
  S.incomes.forEach(function(x){ [x.start, x.end].forEach(function(v){ var i = ymIdx(v); if(i != null) ys.push(Math.floor(i/12)); }); });
  ys = ys.filter(function(y,i,a){ return a.indexOf(y) === i && y >= cy && y <= num(S.sim.endYear); }).sort().slice(0, 14);
  h += '<div class="tblwrap"><table style="font-size:var(--f-xs)"><tr><th>연말</th>'+S.family.map(function(f){ return '<th style="cursor:pointer;text-decoration:underline dotted" onclick="editFamily(\''+f.id+'\')">'+esc(famName(f))+'</th>'; }).join('')+'</tr>'+
    ys.map(function(y){ return '<tr><td>'+y+'</td>'+S.family.map(function(f){ var a = ageAt(f.birth, y*12+11); return '<td>'+(a==null?'':a)+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>'+
    '<div class="tiny" style="margin:6px 0 10px">이름을 누르면 생일·관계 수정</div>';
  return h + '</div>';
}
// 그해 연말 나이를 고치면 생년이 바뀌어 모든 연도 나이가 함께 바뀜 (생일 월·일은 그대로)
function editAge(fid, y){
  var f = S.family.find(function(x){ return x.id === fid; }), a = ageAt(f.birth, y*12+11);
  openModal('<h3>'+esc(famName(f))+' '+y+'년 연말 나이</h3>'+
    '<label class="f">만 나이<input id="f_age" type="number" inputmode="numeric" value="'+(a==null?'':a)+'"></label>'+
    '<div class="btns" style="margin:-4px 0 12px"><button class="btn sub sm" onclick="var e=document.getElementById(\'f_age\');e.value=num(e.value)-1">−1살</button><button class="btn sub sm" onclick="var e=document.getElementById(\'f_age\');e.value=num(e.value)+1">+1살</button></div>'+
    '<div class="tiny" style="margin-bottom:10px">생일 '+esc(f.birth||'(없음)')+' — 나이를 바꾸면 생년만 바뀌고 이후 모든 연도에 반영됩니다.</div>'+
    '<div class="btns"><button class="btn" onclick="saveAge(\''+fid+'\','+y+')">저장</button><button class="btn sub" onclick="closeModal()">취소</button><span style="flex:1"></span><button class="btn sub" onclick="editFamily(\''+fid+'\')">생일 직접 수정</button></div>');
}
function saveAge(fid, y){
  var f = S.family.find(function(x){ return x.id === fid; }), age = num(fv('f_age'));
  var md = f.birth ? f.birth.slice(4) : '-01-01', by = y - age;          // 연말 기준 만 나이 = 그해 − 생년
  var old = f.birth; f.birth = by + md;
  closeModal(); commit(); toast(famName(f)+' 생년 '+(old?old.slice(0,4):'-')+' → '+by+' (이후 나이 모두 반영)');
}
function saveFamily(id){
  var name = fv('f_name').trim() || '가족', rel = fv('f_rel');
  var key = rel === '본인' ? '본인' : rel === '배우자' ? '아내' : null, m = key && S.members.find(function(x){ return x.name === key; });
  if(m){
    var other = S.members.filter(function(x){ return x !== m; }).map(function(x){ return x.nick || x.name; });
    if(other.indexOf(name) >= 0 || name === '공동'){ alert('다른 구성원과 같은 닉네임입니다'); return; }
    m.nick = name;
  }
  upsertItem('family', id, {name:name, rel:rel, birth:fv('f_birth')});
}
function editFamily(id){
  var f = S.family.find(function(x){ return x.id === id; }) || {rel:'자녀'};
  openModal('<h3>'+(id?'가족 수정':'가족 추가')+'</h3>'+
    (f.rel === '본인' || f.rel === '배우자'
      ? '<label class="f">닉네임 (화면 표시 · 설정의 가족 구성원과 같음)<input id="f_name" value="'+esc(famName(f))+'"></label>'
      : '<label class="f">이름<input id="f_name" value="'+esc(f.name)+'"></label>')+
    '<div class="grid2"><label class="f">관계<select id="f_rel">'+REL.map(function(r){ return '<option '+(r===f.rel?'selected':'')+'>'+r+'</option>'; }).join('')+'</select></label>'+
    '<label class="f">생년월일<input id="f_birth" type="date" value="'+esc(f.birth)+'"></label></div>'+
    '<div class="btns"><button class="btn" onclick="saveFamily(\''+(id||'')+'\')">저장</button><button class="btn sub" onclick="closeModal()">취소</button>'+
    (id?'<span style="flex:1"></span><button class="btn bad" onclick="delItem(\'family\',\''+id+'\')">삭제</button>':'')+'</div>');
}

/* ════════ 배분 (버킷) ════════ */
function bucketOptions(sel, forLump){
  var o = forLump ? '<option value="">지정 안 함</option>' : (sel == null ? '<option value="auto" selected>분류에 맞춰 자동</option>' : '') + '<option value="" '+(sel===''?'selected':'')+'>없음 (부동산 등)</option>';
  return o + Object.keys(BUCKETS).map(function(k){ return '<option value="'+k+'" '+(k===sel?'selected':'')+'>'+BUCKETS[k]+'</option>'; }).join('');
}
// 생활비 시작 이후 '소득 < 생활비' 첫 구간 (공백기)
function gapRun(){
  var life = ymIdx(S.sim.lifeStart), start = Math.max(nowIdx(), life == null ? nowIdx() : life), end = num(S.sim.endYear)*12 + 11;
  var run = null;
  for(var i = start; i <= end; i++){
    var short = (spendAt(i) || 0) - incomeAt(i);
    if(short > 0){ if(!run) run = {from:i, to:i, total:0}; run.to = i; run.total += short; }
    else if(run) break;
  }
  if(run) run.endless = run.to === end;
  return run;
}
function bucketTargets(){
  var run = gapRun();
  var rT = S.buckets.reserve.target, gT = S.buckets.gap.target;
  return {
    reserve: rT != null && rT !== '' ? num(rT) : num(S.sim.spend)*6,
    reserveAuto: !(rT != null && rT !== ''),
    gap: gT != null && gT !== '' ? num(gT) : (run && !run.endless ? Math.round(run.total) : 0),
    gapAuto: !(gT != null && gT !== ''),
    run: run
  };
}
function viewAlloc(){
  var bt = bucketTargets(), run = bt.run, cur = {}, planned = {}, now = nowIdx();
  Object.keys(BUCKETS).forEach(function(k){ cur[k] = 0; planned[k] = []; });
  byOwner(S.assets).forEach(function(a){ if(a.bucket && cur[a.bucket] != null) cur[a.bucket] += num(a.value); });
  S.lumps.forEach(function(l){ var i = lumpNext(l, now); if(l.bucket && planned[l.bucket] && i != null && i >= now && (!run || l.bucket !== 'gap' || i < run.from)) planned[l.bucket].push(l); });
  var fin = cur.reserve + cur.gap + cur.growth;
  var parts = Object.keys(BUCKETS).map(function(k){ return {n:BUCKETS[k], v:cur[k], c:BUCKET_COLOR[k]}; });
  var h = ownerChips() + (OWNER ? '<div class="tiny" style="margin:-4px 2px 10px">목적별 예산의 목표 금액은 가계 전체 기준이라 명의별로 보면 부족해 보일 수 있습니다</div>' : '') + '<div class="card R"><h2>목적별 예산 3개</h2>'+donut(parts)+'<div class="tiny" style="margin-top:8px">목적별 예산은 자산 탭에서 자산마다 지정합니다. 부동산은 넣지 않습니다.</div></div>';

  h += kpis([[BUCKETS.reserve, fm(cur.reserve), '', '목표 '+fm(bt.reserve)], [BUCKETS.gap, fm(cur.gap), '', '목표 '+fm(bt.gap)], [BUCKETS.growth, fm(cur.growth), '', fin ? '금융자산의 '+Math.round(cur.growth/fin*100)+'%' : ''], ['금융자산 합계', fm(fin)]]);
  if(run){
    h += '<div class="alert">'+(run.endless
      ? '생활비 시작 뒤로 <b>소득이 생활비보다 계속 적습니다</b>. ② 공백 대비 대신 ③ 장기투자에서 매년 꺼내 쓰는 구조입니다. 생활비를 다시 확인하세요.'
      : '<b>공백기 '+ymDot(idxYm(run.from))+'~'+ymDot(idxYm(run.to))+'</b> ('+(run.to-run.from+1)+'개월): 월 평균 '+fm(run.total/(run.to-run.from+1))+'씩, 합계 <b>'+fm(run.total)+'</b>이 모자랍니다.')+'</div>';
  }

  ['reserve','gap','growth'].forEach(function(k){
    var c = cur[k], pl = sum(planned[k], function(l){ return num(l.amount); });
    h += '<div class="card"><h2><span style="color:'+BUCKET_COLOR[k]+'">●</span> '+BUCKETS[k]+'<span class="sp"></span>'+(k!=='growth'?'<button class="btn sub sm" onclick="editTarget(\''+k+'\')">목표</button>':'')+'</h2>'+
      '<div class="tiny" style="margin-bottom:10px">'+BUCKET_DESC[k]+'</div>';
    var rk = {reserve:'nomR', gap:'nomG', growth:'nomL'}[k], rv = S.sim[rk];
    h += '<label class="rrow">목표 수익률<input type="number" step="0.1" inputmode="decimal" value="'+(rv === '' || rv == null ? '' : esc(rv))+'" placeholder="'+inflRate()+'" onchange="setSim(\''+rk+'\', this.value)">%/년'+
      '<span class="tiny">'+(rv === '' || rv == null ? '비우면 물가상승률 '+inflRate()+'% (실질 0%)' : '실질 '+(Math.round(simRates()[k]*10)/10)+'%')+'</span></label>';
    if(k === 'growth'){
      h += '<div class="grid2"><div class="kv"><div class="k">현재</div><div class="v">'+fm(c)+'</div></div><div class="kv"><div class="k">금융자산 중 비중</div><div class="v">'+(fin?Math.round(c/fin*100):0)+'%</div></div></div>';
    } else {
      var t = k==='reserve' ? bt.reserve : bt.gap, auto = k==='reserve' ? bt.reserveAuto : bt.gapAuto;
      var after = c + pl, ok = after >= t, pct = t ? Math.min(100, Math.round(after/t*100)) : 100;
      h += '<div class="grid2">'+
        '<div class="kv"><div class="k">목표'+(auto?' (자동)':'')+'</div><div class="v">'+fm(t)+'</div></div>'+
        '<div class="kv"><div class="k">현재'+(pl?' + 예정':'')+'</div><div class="v">'+fm(c)+(pl?' <span class="tiny">+'+fm(pl)+'</span>':'')+'</div></div></div>'+
        '<div style="height:8px;background:var(--s3);border-radius:99px;margin:10px 0 6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+(ok?'var(--good)':'var(--warn)')+'"></div></div>'+
        '<div class="tiny '+(ok?'pos':'wrn')+'">'+(t===0?'목표 없음':ok?'목표 충족'+(after-t>0?' · 여유 '+fm(after-t):''):'부족 '+fm(t-after))+'</div>';
      if(auto) h += '<div class="tiny" style="margin-top:4px">'+(k==='reserve'?'자동 = 월 생활비 6개월치. 교육비를 더하려면 [목표]에서 직접 입력':'자동 = 현금흐름의 공백기 부족분 합계')+'</div>';
    }
    var list = byOwner(S.assets).filter(function(a){ return a.bucket === k; });
    if(list.length) h += '<div style="margin-top:10px">'+list.map(function(a){ return '<div class="row" onclick="editAsset(\''+a.id+'\')"><div class="m"><div class="t">'+esc(a.name)+(a.owner?'<span class="tag">'+esc(nm(a.owner))+'</span>':'')+'</div></div><div class="v">'+fm(num(a.value))+'</div></div>'; }).join('')+'</div>';
    if(planned[k].length) h += planned[k].map(function(l){ return '<div class="row" onclick="editLump(\''+l.id+'\')"><div class="m"><div class="t">'+esc(l.name)+'<span class="tag">예정 '+ymDot(l.month)+'</span></div></div><div class="v pos">+'+fm(num(l.amount))+'</div></div>'; }).join('');
    h += '</div>';
  });

  // 이동 계획: 공백기 직전 자동 항목 + 직접 입력 항목
  var items = S.moves.map(function(m){ return {id:m.id, month:m.month, text:m.text, done:m.done}; });
  if(run && !run.endless) items.push({auto:true, month:idxYm(run.from - 1), text:'② 공백 대비 자금 '+fm(bt.gap)+'을 예금·단기채로 옮기기 ('+ymDot(idxYm(run.from))+'부터 매달 꺼내 씀)'});
  items.sort(function(a,b){ return (a.month||'').localeCompare(b.month||''); });
  h += '<div class="card R"><h2>이동 계획<span class="sp"></span><button class="btn sm" onclick="editMove()">+ 추가</button></h2>';
  if(!items.length) h += '<div class="empty">목적별 예산 사이에서 돈을 옮길 일정을 적어 둡니다</div>';
  items.forEach(function(m){
    var i = ymIdx(m.month), soon = !m.done && i != null && i - now <= 12 && i >= now, past = !m.done && i != null && i < now;
    h += '<div class="chk-item '+(m.done?'done':'')+'">'+(m.auto?'<span style="width:22px;text-align:center" class="tiny">자동</span>':'<input type="checkbox" '+(m.done?'checked':'')+' onchange="toggleMove(\''+m.id+'\')">')+
      '<div class="tx" '+(m.auto?'':'onclick="editMove(\''+m.id+'\')" style="cursor:pointer"')+'><div class="num tiny '+(past?'neg':soon?'wrn':'')+'">'+ymDot(m.month)+(soon?' · 1년 이내':past?' · 지남':'')+'</div>'+esc(m.text)+'</div></div>';
  });
  h += '</div>';
  return h;
}
function editTarget(k){
  var bt = bucketTargets(), cur = S.buckets[k].target;
  openModal('<h3>'+BUCKETS[k]+' 목표</h3>'+
    '<label class="f">목표 금액 (만원, 비우면 자동: '+fm(k==='reserve'?num(S.sim.spend)*6:(bt.run&&!bt.run.endless?bt.run.total:0))+')<input id="f_t" type="number" inputmode="decimal" value="'+(cur==null?'':esc(cur))+'"></label>'+
    '<div class="btns"><button class="btn" onclick="S.buckets[\''+k+'\'].target=(fv(\'f_t\').trim()===\'\'?null:num(fv(\'f_t\')));closeModal();commit()">저장</button><button class="btn sub" onclick="closeModal()">취소</button></div>');
}
function editMove(id){
  var m = S.moves.find(function(x){ return x.id === id; }) || {};
  openModal('<h3>'+(id?'이동 계획 수정':'이동 계획 추가')+'</h3>'+
    '<label class="f">시기<input id="f_month" type="month" value="'+esc(m.month)+'"></label>'+
    '<label class="f">내용<input id="f_text" value="'+esc(m.text)+'" placeholder="예: 공제회(본인) 만기 → ③ 장기투자 ETF 매수"></label>'+
    '<div class="btns"><button class="btn" onclick="upsertItem(\'moves\',\''+(id||'')+'\',{month:fv(\'f_month\'),text:fv(\'f_text\').trim()||\'이동\'})">저장</button><button class="btn sub" onclick="closeModal()">취소</button>'+
    (id?'<span style="flex:1"></span><button class="btn bad" onclick="delItem(\'moves\',\''+id+'\')">삭제</button>':'')+'</div>');
}
function toggleMove(id){ var m = S.moves.find(function(x){ return x.id === id; }); if(m){ m.done = !m.done; commit(); } }

/* ════════ 시작 ════════ */
document.documentElement.dataset.theme = localStorage.getItem('cf_theme') || 'dark';
if(document.documentElement.dataset.theme === 'light') document.querySelector('meta[name=theme-color]').content = '#EEF3FB';
history.replaceState({tab:TAB}, '', '#'+TAB);
render();
setCloud('off');
if(sb){
  sb.auth.onAuthStateChange(function(ev, session){
    var u = session ? session.user : null;
    var changed = (u && u.id) !== (_user && _user.id);
    _user = u;
    if(!u){ setCloud('off'); return; }
    if(changed) setTimeout(function(){ cloudPull(); }, 0);   // 콜백 안에서 바로 호출하면 멈출 수 있어 다음 틱으로
  });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible' && _user) cloudPull(); });
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
